name: mygarage_buyer
description: MyGarage buyer mobile app — services, shop, cart, garage, and profile.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  http: ^1.2.2
  go_router: ^14.6.2
  provider: ^6.1.2
  flutter_dotenv: ^5.2.1
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  google_fonts: 8.0.0
  image_picker: ^1.1.2
  http_parser: ^4.0.2
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/images/app_icon.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/images/app_icon.png
    background_color: "#000000"
    theme_color: "#000000"

flutter:
  uses-material-design: true
  assets:
    # Use a non-dot filename — Flutter web often 404s root ".env" as an asset.
    - assets/app.env
    - assets/images/logo-black.png
    - assets/images/app_icon.png
