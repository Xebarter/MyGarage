<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MyGarage — parts, services, and garage">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MyGarage">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MyGarage</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #f2f4f8;
    }
    #flutter-error {
      display: none;
      font-family: "Segoe UI", system-ui, sans-serif;
      max-width: 28rem;
      margin: 3rem auto;
      padding: 1.5rem;
      color: #0b1220;
      line-height: 1.45;
    }
    #flutter-error h1 {
      font-size: 1.25rem;
      margin: 0 0 0.75rem;
    }
    #flutter-error p {
      margin: 0 0 0.75rem;
      color: #475569;
      font-size: 0.95rem;
    }
    #flutter-error button {
      appearance: none;
      border: 0;
      border-radius: 10px;
      background: #1e4ed8;
      color: #fff;
      font-weight: 600;
      padding: 0.7rem 1.1rem;
      cursor: pointer;
    }
    #flutter-error code {
      font-size: 0.8rem;
      background: #e2e8f0;
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="flutter-error" role="alert">
    <h1>Could not start MyGarage</h1>
    <p>
      The web engine failed to load graphics (CanvasKit). This often happens when the
      browser network resets mid-load (<code>ERR_NETWORK_CHANGED</code>) or the
      Google CDN is blocked.
    </p>
    <p>
      <button type="button" onclick="location.reload()">Retry</button>
    </p>
    <p style="font-size:0.85rem">
      For local dev, prefer:
      <br>
      <code>flutter run -d chrome --no-web-resources-cdn</code>
    </p>
  </div>

  <!--
    Inline bootstrap so we can surface engine load failures and rely on
    local CanvasKit when running with --no-web-resources-cdn.
  -->
  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    const errorEl = document.getElementById('flutter-error');

    _flutter.loader.load({
      onEntrypointLoaded: async function (engineInitializer) {
        try {
          const appRunner = await engineInitializer.initializeEngine();
          await appRunner.runApp();
        } catch (err) {
          console.error('[MyGarage] Flutter engine failed to start', err);
          if (errorEl) errorEl.style.display = 'block';
        }
      },
    });
  </script>
</body>
</html>
