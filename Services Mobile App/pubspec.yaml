name: mygarage_services
description: MyGarage service provider mobile app — jobs, trips, listings, and funds.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  http: ^1.2.2
  go_router: ^14.6.2
  provider: ^6.1.2
  flutter_dotenv: ^5.2.1
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  intl: ^0.19.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  google_fonts: 8.0.0
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/app_logo.png
    - assets/images/logo_mark.png
