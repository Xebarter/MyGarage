name: mygarage_supplier
description: MyGarage supplier mobile app — products, orders, funds, and promotions.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  http: ^1.2.2
  go_router: ^14.6.2
  provider: ^6.1.2
  flutter_dotenv: ^5.2.1
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  google_fonts: 8.0.0
  flutter_animate: ^4.5.2
  image_picker: ^1.1.2
  http_parser: ^4.0.2
  flutter_svg: ^2.3.0
  firebase_core: ^3.15.2
  firebase_auth: ^5.5.4
  fl_chart: ^0.70.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#9E1038"
  adaptive_icon_foreground: assets/images/app_icon_foreground.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/app_logo.png
    - assets/images/logo_mark.png
    - assets/images/app_icon.png
    - assets/images/google_g.svg
